<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>텍스트 비교 — kswany</title>
    <meta name="description" content="왼쪽과 오른쪽에 글을 붙여 넣으면 다른 줄을 바로 표시합니다. 서버 없이 브라우저에서만 비교합니다." />
    <link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <link rel="stylesheet" href="../../css/site.css" />
    <link rel="stylesheet" href="compare.css" />
  </head>
  <body>
    <div class="wrap">
      <header class="topbar">
        <a class="brand" href="../../">
          <strong>kswany</strong>
          <span>게임과 실험</span>
        </a>
        <nav class="nav">
          <a href="../../">홈</a>
          <a href="../../saju/">사주</a>
          <a href="../../games/">게임</a>
          <a href="../" aria-current="page">실험</a>
          <a href="../../guestbook/">방명록</a>
        </nav>
      </header>

      <section class="page-head">
        <div class="seal">DIFF</div>
        <h1>텍스트 비교</h1>
        <p>왼쪽과 오른쪽에 글을 붙여 넣고 비교하기를 누르세요. 다른 줄은 색으로 표시되고, 줄 번호도 함께 보여 줍니다.</p>
      </section>

      <section class="panel">
        <div class="compare-grid">
          <label class="field">
            <span>왼쪽 (원본)</span>
            <textarea id="text-a" rows="10" placeholder="첫 번째 글을 붙여 넣으세요"></textarea>
          </label>
          <label class="field">
            <span>오른쪽 (비교)</span>
            <textarea id="text-b" rows="10" placeholder="두 번째 글을 붙여 넣으세요"></textarea>
          </label>
        </div>

        <div class="actions">
          <button class="primary" type="button" id="compare-btn">비교하기</button>
          <button class="ghost" type="button" id="swap-btn">좌우 바꾸기</button>
          <button class="ghost" type="button" id="clear-btn">비우기</button>
        </div>

        <div class="stats" id="stats" hidden>
          <span>같은 줄 <strong id="stat-same">0</strong></span>
          <span>바뀐 줄 <strong id="stat-changed">0</strong></span>
          <span>왼쪽만 <strong id="stat-removed">0</strong></span>
          <span>오른쪽만 <strong id="stat-added">0</strong></span>
        </div>

        <div class="result-wrap" id="result-wrap" hidden>
          <h2 class="section-title">비교 결과</h2>
          <p class="result-hint" id="result-hint"></p>
          <div class="diff-view" id="diff-view" aria-live="polite"></div>
        </div>
      </section>

      <footer class="foot">© kswany · 입력한 글은 이 브라우저에서만 비교됩니다</footer>
    </div>
    <script src="compare.js"></script>
    <script src="../../js/nav.js" defer></script>
    <script src="../../js/lab.js" defer></script>
  </body>
</html>
