<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>인코딩 도구 — kswany</title>
    <meta name="description" content="글을 Base64나 URL 형식으로 바꾸거나 되돌립니다. 서버 없이 브라우저에서만 실행됩니다." />
    <link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <link rel="stylesheet" href="../../css/site.css" />
    <link rel="stylesheet" href="encode.css" />
  </head>
  <body>
    <div class="wrap">
      <header class="topbar">
        <a class="brand" href="../../">
          <strong>kswany</strong>
          <span>게임과 실험</span>
        </a>
        <nav class="nav">
          <a href="../../">홈</a>
          <a href="../../saju/">사주</a>
          <a href="../../games/">게임</a>
          <a href="../" aria-current="page">실험</a>
          <a href="../../guestbook/">방명록</a>
        </nav>
      </header>

      <section class="page-head">
        <div class="seal">ENC</div>
        <h1>인코딩 도구</h1>
        <p>글을 Base64나 URL 형식으로 바꾸거나 되돌립니다. 한글도 그대로 처리됩니다.</p>
      </section>

      <section class="panel">
        <div class="mode-tabs" role="tablist" aria-label="인코딩 방식">
          <button class="mode-tab active" type="button" role="tab" aria-selected="true" data-mode="base64">Base64</button>
          <button class="mode-tab" type="button" role="tab" aria-selected="false" data-mode="url">URL</button>
        </div>

        <p class="mode-desc" id="mode-desc">Base64는 바이너리·텍스트를 안전한 문자열로 바꿀 때 씁니다.</p>

        <label class="field">
          <span>입력</span>
          <textarea id="encode-input" rows="8" spellcheck="false" placeholder="여기에 글을 붙여 넣으세요"></textarea>
        </label>

        <div class="toolbar">
          <div class="actions">
            <button class="primary" type="button" id="encode-btn">인코딩</button>
            <button class="ghost" type="button" id="decode-btn">디코딩</button>
            <button class="ghost" type="button" id="swap-btn">입력↔결과 바꾸기</button>
            <button class="ghost" type="button" id="copy-btn">결과 복사</button>
            <button class="ghost" type="button" id="sample-btn">예시 넣기</button>
            <button class="ghost" type="button" id="clear-btn">비우기</button>
          </div>
        </div>

        <div class="status ok" id="status-ok" hidden aria-live="polite">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M20 6L9 17l-5-5" />
          </svg>
          <span id="status-ok-text">변환했습니다.</span>
        </div>

        <div class="status err" id="status-err" hidden aria-live="assertive">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <circle cx="12" cy="12" r="10" />
            <path d="M12 8v4M12 16h.01" />
          </svg>
          <div>
            <strong id="status-err-title">변환 오류</strong>
            <p id="status-err-text"></p>
          </div>
        </div>

        <label class="field output-field">
          <span>결과</span>
          <textarea id="encode-output" rows="8" readonly spellcheck="false" placeholder="변환된 결과가 여기에 나옵니다"></textarea>
        </label>

        <p class="hint" id="stat-hint">입력값은 서버로 보내지 않습니다. 붙여 넣은 뒤 인코딩 또는 디코딩을 누르세요.</p>
      </section>

      <footer class="foot">© kswany · 입력값은 이 브라우저에서만 처리됩니다</footer>
    </div>
    <script src="encode.js" defer></script>
    <script src="../../js/nav.js" defer></script>
    <script src="../../js/lab.js" defer></script>
  </body>
</html>
