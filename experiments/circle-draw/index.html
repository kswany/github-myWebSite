<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>원 그리기 — kswany</title>
    <meta name="description" content="손으로 원을 그리면 얼마나 둥근지 점수를 매깁니다. 브라우저에서만 실행됩니다." />
    <link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <link rel="stylesheet" href="../../css/site.css" />
    <link rel="stylesheet" href="circle.css" />
  </head>
  <body>
    <div class="wrap">
      <header class="topbar">
        <a class="brand" href="../../">
          <strong>kswany</strong>
          <span>게임과 실험</span>
        </a>
        <nav class="nav">
          <a href="../../">홈</a>
          <a href="../../saju/">사주</a>
          <a href="../../games/">게임</a>
          <a href="../" aria-current="page">실험</a>
          <a href="../../guestbook/">방명록</a>
        </nav>
      </header>

      <section class="page-head">
        <div class="seal">CIRCLE</div>
        <h1>원 그리기</h1>
        <p>아래 칸에 원을 그려 보세요. 시작점과 끝점을 맞출수록, 반지름이 고르게 유지될수록 점수가 올라갑니다. 최고 점수는 이 브라우저에만 저장됩니다.</p>
      </section>

      <section class="panel">
        <div class="score-grid">
          <div class="score-box">
            <span class="label">방금</span>
            <strong id="stat-last">-</strong>
          </div>
          <div class="score-box">
            <span class="label">최고</span>
            <strong id="stat-best">-</strong>
          </div>
          <div class="score-box">
            <span class="label">시도</span>
            <strong id="stat-tries">0</strong>
          </div>
        </div>

        <div class="draw-wrap">
          <canvas id="draw-canvas" aria-label="원을 그리는 캔버스"></canvas>
          <p class="draw-hint" id="draw-hint">누른 채로 원을 그리세요</p>
        </div>

        <p class="result-msg" id="result-msg" aria-live="polite"></p>

        <div class="actions">
          <button class="ghost" type="button" id="clear-btn">지우고 다시</button>
        </div>
      </section>

      <footer class="foot">© kswany · 그림은 이 브라우저에서만 처리됩니다</footer>
    </div>
    <script src="circle.js" defer></script>
    <script src="../../js/nav.js" defer></script>
    <script src="../../js/lab.js" defer></script>
  </body>
</html>
