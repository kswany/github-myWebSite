<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>오늘 지출 한 줄 — kswany</title>
    <meta name="description" content="금액과 메모만 적으면 오늘 지출 합계를 바로 봅니다. 브라우저에만 저장됩니다." />
    <link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <link rel="stylesheet" href="../../css/site.css" />
    <link rel="stylesheet" href="spend.css" />
  </head>
  <body>
    <div class="wrap">
      <header class="topbar">
        <a class="brand" href="../../">
          <strong>kswany</strong>
          <span>게임과 실험</span>
        </a>
        <nav class="nav">
          <a href="../../">홈</a>
          <a href="../../saju/">사주</a>
          <a href="../../games/">게임</a>
          <a href="../" aria-current="page">실험</a>
          <a href="../../guestbook/">방명록</a>
        </nav>
      </header>

      <section class="page-head">
        <div class="seal">SPEND</div>
        <h1>오늘 지출 한 줄</h1>
        <p>금액과 짧은 메모만 적으면 오늘 합계가 쌓입니다. 가계부 앱처럼 복잡하지 않아요.</p>
      </section>

      <section class="panel">
        <div class="total-card" aria-live="polite">
          <p class="total-label">오늘 합계</p>
          <p class="total-amount" id="total-amount">0원</p>
          <p class="total-meta"><span id="item-count">0</span>건 · <span id="today-label"></span></p>
        </div>

        <form class="add-form" id="add-form" autocomplete="off">
          <label class="sr-only" for="amount-input">금액</label>
          <input type="number" id="amount-input" inputmode="numeric" min="1" max="99999999" step="1" placeholder="금액 (원)" required />
          <label class="sr-only" for="memo-input">메모</label>
          <input type="text" id="memo-input" maxlength="40" placeholder="메모 (선택)" />
          <button class="primary" type="submit" id="btn-add">추가</button>
        </form>

        <ul class="spend-list" id="spend-list" aria-label="오늘 지출 목록"></ul>
        <p class="empty-msg" id="empty-msg">아직 적은 지출이 없습니다. 위에 금액을 넣고 추가해 보세요.</p>

        <div class="panel-actions">
          <button class="ghost" type="button" id="btn-clear">오늘 목록 비우기</button>
        </div>

        <p class="fine-print">기록은 이 브라우저에만 남습니다. 날짜가 바뀌면 새로 시작합니다.</p>
      </section>

      <footer class="foot">© kswany · 실험은 방문자의 브라우저에서만 실행됩니다</footer>
    </div>
    <script src="spend.js" defer></script>
    <script src="../../js/nav.js" defer></script>
    <script src="../../js/lab.js" defer></script>
  </body>
</html>
