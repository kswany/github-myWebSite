<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>할 일 우선순위 — kswany</title>
    <meta name="description" content="오늘 할 일 세 개까지 순서를 정해 두세요. 버튼으로 위·아래를 바꿀 수 있습니다." />
    <link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <link rel="stylesheet" href="../../css/site.css" />
    <link rel="stylesheet" href="todo.css" />
  </head>
  <body>
    <div class="wrap">
      <header class="topbar">
        <a class="brand" href="../../">
          <strong>kswany</strong>
          <span>게임과 실험</span>
        </a>
        <nav class="nav">
          <a href="../../">홈</a>
          <a href="../../saju/">사주</a>
          <a href="../../games/">게임</a>
          <a href="../" aria-current="page">실험</a>
          <a href="../../guestbook/">방명록</a>
        </nav>
      </header>

      <section class="page-head">
        <div class="seal">TOP 3</div>
        <h1>할 일 우선순위</h1>
        <p>오늘 꼭 할 일을 최대 세 개까지 적고, 버튼으로 1·2·3순위를 정합니다. 드래그는 없어요.</p>
      </section>

      <section class="panel">
        <form class="add-form" id="add-form" autocomplete="off">
          <label class="sr-only" for="task-input">새 할 일</label>
          <input type="text" id="task-input" maxlength="80" placeholder="할 일을 입력하세요" />
          <button class="primary-btn" type="submit" id="btn-add">추가</button>
        </form>
        <p class="slot-hint" id="slot-hint">남은 칸 <strong id="slots-left">3</strong>개</p>

        <ol class="task-list" id="task-list" aria-label="우선순위 목록"></ol>

        <p class="empty-msg" id="empty-msg">아직 할 일이 없습니다. 위에 적고 추가를 눌러 보세요.</p>

        <div class="summary-card" id="summary-card" hidden>
          <p class="summary-title">지금 순서</p>
          <ul class="summary-lines" id="summary-lines"></ul>
        </div>

        <div class="panel-actions">
          <button class="ghost-btn" type="button" id="btn-clear-done">완료한 것 지우기</button>
          <button class="ghost-btn" type="button" id="btn-reset-all">전체 비우기</button>
        </div>

        <p class="fine-print">목록은 이 브라우저에만 저장됩니다. 다른 기기와는 공유되지 않습니다.</p>
      </section>

      <footer class="foot">© kswany · 실험은 방문자의 브라우저에서만 실행됩니다</footer>
    </div>
    <script src="todo.js" defer></script>
    <script src="../../js/nav.js" defer></script>
    <script src="../../js/lab.js" defer></script>
  </body>
</html>
