<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>실험 — kswany</title>
    <meta name="description" content="kswany의 작은 웹 실험 모음. 브라우저에서만 실행됩니다." />
    <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <link rel="stylesheet" href="../css/site.css" />
  </head>
  <body>
    <div class="wrap">
      <header class="topbar">
        <a class="brand" href="../">
          <strong>kswany</strong>
          <span>게임과 실험</span>
        </a>
        <nav class="nav">
          <a href="../">홈</a>
          <a href="../saju/">사주</a>
          <a href="../games/">게임</a>
          <a href="./" aria-current="page">실험</a>
          <a href="../guestbook/">방명록</a>
        </nav>
      </header>

      <section class="page-head">
        <h1>실험</h1>
        <p>홈에 올린 작은 페이지들입니다. 서버 없이 이 브라우저에서만 돌아갑니다.</p>
      </section>

      <!-- 매일 자동화: 새 기능 카드를 여기에도 넣고, 루트 index.html .grid 카드는 빠뜨리지 않는다. 기존 실험 폴더와 site.css는 수정하지 않는다. -->
      <section class="grid">
        <a class="card" href="food-worldcup/" data-tone="gold">
          <div class="kicker">월드컵</div>
          <h2>음식 월드컵</h2>
          <p>둘 중 더 끌리는 쪽을 고르면 우승이 나옵니다.</p>
        </a>
        <a class="card" href="reaction-test/" data-tone="green">
          <div class="kicker">반사</div>
          <h2>반응속도</h2>
          <p>초록이 되면 바로 누르세요.</p>
        </a>
        <a class="card" href="balance-game/" data-tone="ink">
          <div class="kicker">선택</div>
          <h2>밸런스 게임</h2>
          <p>A와 B 중 더 끌리는 쪽을 고르세요.</p>
        </a>
      </section>

      <footer class="foot">© kswany · 실험은 방문자의 브라우저에서만 실행됩니다</footer>
    </div>
    <script src="../js/nav.js" defer></script>
    <script src="../js/lab.js" defer></script>
  </body>
</html>
