<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>제비뽑기 — kswany</title>
    <meta name="description" content="이름이나 숫자를 섞어 하나를 뽑아 주는 작은 도구. 브라우저에서만 실행됩니다." />
    <link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <link rel="stylesheet" href="../../css/site.css" />
    <link rel="stylesheet" href="pick.css" />
  </head>
  <body>
    <div class="wrap">
      <header class="topbar">
        <a class="brand" href="../../">
          <strong>kswany</strong>
          <span>게임과 실험</span>
        </a>
        <nav class="nav">
          <a href="../../">홈</a>
          <a href="../../saju/">사주</a>
          <a href="../../games/">게임</a>
          <a href="../" aria-current="page">실험</a>
          <a href="../../guestbook/">방명록</a>
        </nav>
      </header>

      <section class="page-head">
        <div class="seal">PICK</div>
        <h1>제비뽑기</h1>
        <p>이름이나 숫자를 적어 두고 버튼 한 번이면 공정하게 하나를 뽑아 줍니다. 입력값은 서버로 보내지 않습니다.</p>
      </section>

      <section class="panel">
        <div class="mode-bar" role="tablist" aria-label="뽑기 방식">
          <button class="mode-btn active" type="button" role="tab" id="tab-list" aria-selected="true" aria-controls="panel-list">이름 목록</button>
          <button class="mode-btn" type="button" role="tab" id="tab-range" aria-selected="false" aria-controls="panel-range">숫자 범위</button>
        </div>

        <div class="mode-panel active" id="panel-list" role="tabpanel" aria-labelledby="tab-list">
          <div class="field">
            <label for="items">한 줄에 하나씩 적어 주세요</label>
            <textarea id="items" rows="6" placeholder="민수&#10;지영&#10;하늘&#10;서준"></textarea>
          </div>
          <p class="hint">총 <strong id="item-count">0</strong>개 · 빈 줄은 빼고 섞습니다</p>
        </div>

        <div class="mode-panel" id="panel-range" role="tabpanel" aria-labelledby="tab-range" hidden>
          <div class="range-row">
            <div class="field">
              <label for="range-min">최소</label>
              <input type="number" id="range-min" inputmode="numeric" value="1" />
            </div>
            <span class="range-dash" aria-hidden="true">~</span>
            <div class="field">
              <label for="range-max">최대</label>
              <input type="number" id="range-max" inputmode="numeric" value="100" />
            </div>
          </div>
          <p class="hint">범위 안의 정수 중 하나를 무작위로 고릅니다</p>
        </div>

        <div class="draw-stage" id="draw-stage" aria-live="polite">
          <p class="draw-kicker" id="draw-kicker">준비됐어요</p>
          <p class="draw-value" id="draw-value">?</p>
          <p class="draw-sub" id="draw-sub">뽑기를 누르면 돌아갑니다</p>
        </div>

        <div class="actions">
          <button class="primary" type="button" id="draw-btn">뽑기</button>
          <button class="ghost" type="button" id="reset-btn">처음으로</button>
        </div>
      </section>

      <footer class="foot">© kswany · 제비뽑기는 이 브라우저에서만 돌아갑니다</footer>
    </div>
    <script src="../../js/nav.js" defer></script>
    <script src="../../js/lab.js" defer></script>
    <script src="pick.js" defer></script>
  </body>
</html>
