<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>UUID 만들기 — kswany</title>
    <meta name="description" content="버튼 한 번에 고유 ID(UUID v4)를 만듭니다. 브라우저에서만 실행됩니다." />
    <link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <link rel="stylesheet" href="../../css/site.css" />
    <link rel="stylesheet" href="uuid.css" />
  </head>
  <body>
    <div class="wrap">
      <header class="topbar">
        <a class="brand" href="../../">
          <strong>kswany</strong>
          <span>게임과 실험</span>
        </a>
        <nav class="nav">
          <a href="../../">홈</a>
          <a href="../../saju/">사주</a>
          <a href="../../games/">게임</a>
          <a href="../" aria-current="page">실험</a>
          <a href="../../guestbook/">방명록</a>
        </nav>
      </header>

      <section class="page-head">
        <div class="seal">UID</div>
        <h1>UUID 만들기</h1>
        <p>버튼 한 번에 고유 ID를 만듭니다. 개발·테스트용으로 바로 복사해 쓸 수 있습니다.</p>
      </section>

      <section class="panel">
        <div class="options">
          <fieldset class="option-group">
            <legend>개수</legend>
            <div class="chip-row" role="group" aria-label="생성 개수">
              <button class="chip active" type="button" data-count="1">1개</button>
              <button class="chip" type="button" data-count="3">3개</button>
              <button class="chip" type="button" data-count="5">5개</button>
              <button class="chip" type="button" data-count="10">10개</button>
            </div>
          </fieldset>

          <label class="toggle">
            <input type="checkbox" id="uppercase" />
            <span class="toggle-ui" aria-hidden="true"></span>
            <span>대문자로 표시</span>
          </label>
        </div>

        <div class="uuid-stage" aria-live="polite">
          <p class="stage-kicker" id="stage-kicker">아직 없음</p>
          <ul class="uuid-list" id="uuid-list">
            <li class="uuid-empty">아래 버튼을 누르면 UUID v4가 나옵니다</li>
          </ul>
        </div>

        <div class="actions">
          <button class="primary" type="button" id="generate-btn">UUID 만들기</button>
          <button class="ghost" type="button" id="copy-btn" disabled>복사</button>
          <button class="ghost" type="button" id="clear-btn">비우기</button>
        </div>

        <div class="status ok" id="status-ok" hidden aria-live="polite">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M20 6L9 17l-5-5" />
          </svg>
          <span id="status-ok-text">복사했습니다.</span>
        </div>

        <p class="hint">형식은 UUID v4입니다. 값은 서버로 보내지 않고 이 브라우저에서만 만듭니다.</p>
      </section>

      <footer class="foot">© kswany · UUID는 이 브라우저에서만 생성됩니다</footer>
    </div>
    <script src="uuid.js" defer></script>
    <script src="../../js/nav.js" defer></script>
    <script src="../../js/lab.js" defer></script>
  </body>
</html>
