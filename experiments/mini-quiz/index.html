<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>오늘의 하루 타입 — kswany</title>
    <meta name="description" content="다섯 문항만 고르면 오늘 나에게 맞는 하루 타입이 한 장으로 나옵니다. 브라우저에서만 실행됩니다." />
    <link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <link rel="stylesheet" href="../../css/site.css" />
    <link rel="stylesheet" href="quiz.css" />
  </head>
  <body>
    <div class="wrap">
      <header class="topbar">
        <a class="brand" href="../../">
          <strong>kswany</strong>
          <span>게임과 실험</span>
        </a>
        <nav class="nav">
          <a href="../../">홈</a>
          <a href="../../saju/">사주</a>
          <a href="../../games/">게임</a>
          <a href="../" aria-current="page">실험</a>
          <a href="../../guestbook/">방명록</a>
        </nav>
      </header>

      <section class="page-head">
        <div class="seal">QUIZ</div>
        <h1>오늘의 하루 타입</h1>
        <p>지금 기분에 가까운 쪽을 다섯 번만 고르세요. 오늘 나에게 맞는 하루가 한 장으로 정리됩니다.</p>
      </section>

      <section class="panel">
        <div class="hud">
          <span>문항 <strong id="q-num">1</strong> / <strong>5</strong></span>
          <span>지난번 <strong id="last-type">-</strong></span>
        </div>

        <div class="progress-track" aria-hidden="true">
          <div class="progress-fill" id="progress-fill"></div>
        </div>

        <p class="question" id="question">-</p>

        <div class="choices" id="choices">
          <button class="choice-btn" type="button" id="choice-a"></button>
          <button class="choice-btn" type="button" id="choice-b"></button>
        </div>

        <div class="overlay" id="result">
          <p class="result-kicker">오늘의 타입</p>
          <div class="result-badge" id="result-badge" aria-hidden="true"></div>
          <h2 class="section-title" id="result-title">-</h2>
          <p class="reading" id="result-desc"></p>
          <ul class="result-tags" id="result-tags"></ul>
          <div class="actions" style="margin-top: 14px">
            <button class="primary" type="button" id="again">다시 고르기</button>
            <button class="ghost" type="button" id="share">결과 복사</button>
          </div>
        </div>

        <div class="actions" style="margin-top: 16px">
          <button class="ghost" type="button" id="restart">처음부터</button>
        </div>
      </section>

      <footer class="foot">© kswany · 선택은 방문자의 브라우저에서만 이뤄집니다</footer>
    </div>
    <script src="quiz.js"></script>
    <script src="../../js/nav.js" defer></script>
    <script src="../../js/lab.js" defer></script>
  </body>
</html>
