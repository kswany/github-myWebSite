<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>QR 코드 만들기 — kswany</title>
    <meta name="description" content="글·주소를 넣으면 QR 코드 이미지를 바로 만듭니다. 브라우저에서만 실행됩니다." />
    <link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <link rel="stylesheet" href="../../css/site.css" />
    <link rel="stylesheet" href="qr.css" />
  </head>
  <body>
    <div class="wrap">
      <header class="topbar">
        <a class="brand" href="../../">
          <strong>kswany</strong>
          <span>게임과 실험</span>
        </a>
        <nav class="nav">
          <a href="../../">홈</a>
          <a href="../../saju/">사주</a>
          <a href="../../games/">게임</a>
          <a href="../" aria-current="page">실험</a>
          <a href="../../guestbook/">방명록</a>
        </nav>
      </header>

      <section class="page-head">
        <div class="seal">QR</div>
        <h1>QR 코드 만들기</h1>
        <p>글·주소·전화번호를 넣으면 QR 이미지를 바로 만듭니다. 스캔하면 내용이 열립니다.</p>
      </section>

      <section class="panel">
        <label class="field">
          <span>내용</span>
          <textarea id="content" rows="4" spellcheck="false" placeholder="예: https://github.com/kswany 또는 안녕하세요"></textarea>
        </label>

        <div class="options">
          <fieldset class="option-group">
            <legend>크기</legend>
            <div class="chip-row" role="group" aria-label="QR 크기">
              <button class="chip" type="button" data-size="160">작게</button>
              <button class="chip active" type="button" data-size="240">보통</button>
              <button class="chip" type="button" data-size="320">크게</button>
            </div>
          </fieldset>

          <fieldset class="option-group">
            <legend>오류 보정</legend>
            <div class="chip-row" role="group" aria-label="오류 보정 수준">
              <button class="chip" type="button" data-ec="L">낮음</button>
              <button class="chip active" type="button" data-ec="M">보통</button>
              <button class="chip" type="button" data-ec="H">높음</button>
            </div>
          </fieldset>
        </div>

        <div class="color-row">
          <label class="color-field">
            <span>QR 색</span>
            <div class="color-control">
              <input type="color" id="fg-picker" value="#1E293B" aria-label="QR 색" />
              <input type="text" id="fg-hex" spellcheck="false" value="#1E293B" autocomplete="off" />
            </div>
          </label>
          <label class="color-field">
            <span>배경색</span>
            <div class="color-control">
              <input type="color" id="bg-picker" value="#FFFFFF" aria-label="배경색" />
              <input type="text" id="bg-hex" spellcheck="false" value="#FFFFFF" autocomplete="off" />
            </div>
          </label>
        </div>

        <div class="qr-stage" aria-live="polite">
          <div class="qr-frame" id="qr-frame">
            <canvas id="qr-canvas" width="240" height="240" aria-label="QR 코드 미리보기"></canvas>
            <p class="qr-empty" id="qr-empty">내용을 넣으면 QR이 나옵니다</p>
          </div>
          <p class="stage-kicker" id="stage-kicker">아직 없음</p>
        </div>

        <div class="status err" id="status-err" hidden aria-live="assertive">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <circle cx="12" cy="12" r="10" />
            <path d="M12 8v4M12 16h.01" />
          </svg>
          <div>
            <strong>만들기 실패</strong>
            <p id="status-err-text">내용이 너무 길거나 색 코드가 올바르지 않습니다.</p>
          </div>
        </div>

        <div class="actions">
          <button class="primary" type="button" id="generate-btn">QR 만들기</button>
          <button class="ghost" type="button" id="download-btn" disabled>PNG 저장</button>
          <button class="ghost" type="button" id="sample-btn">예시 넣기</button>
        </div>

        <p class="hint">입력값은 서버로 보내지 않습니다. 이 브라우저에서만 QR을 그립니다.</p>
      </section>

      <footer class="foot">© kswany · QR 코드는 이 브라우저에서만 만듭니다</footer>
    </div>
    <script src="qrcode-lib.js" defer></script>
    <script src="qr.js" defer></script>
    <script src="../../js/nav.js" defer></script>
    <script src="../../js/lab.js" defer></script>
  </body>
</html>
