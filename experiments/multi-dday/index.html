<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>디데이 모아보기 — kswany</title>
    <meta name="description" content="중요한 날 최대 5개를 적어 두면 남은 일과 지난 일을 한눈에 봅니다. 브라우저에만 저장됩니다." />
    <link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <link rel="stylesheet" href="../../css/site.css" />
    <link rel="stylesheet" href="dday.css" />
  </head>
  <body>
    <div class="wrap">
      <header class="topbar">
        <a class="brand" href="../../">
          <strong>kswany</strong>
          <span>게임과 실험</span>
        </a>
        <nav class="nav">
          <a href="../../">홈</a>
          <a href="../../saju/">사주</a>
          <a href="../../games/">게임</a>
          <a href="../" aria-current="page">실험</a>
          <a href="../../guestbook/">방명록</a>
        </nav>
      </header>

      <section class="page-head">
        <div class="seal">D-DAY</div>
        <h1>디데이 모아보기</h1>
        <p>시험, 여행, 기념일처럼 중요한 날을 최대 다섯 개까지 적어 두세요. 오늘 기준으로 얼마나 남았는지, 며칠 지났는지 한눈에 정리됩니다.</p>
      </section>

      <section class="panel">
        <form class="add-form" id="add-form" autocomplete="off">
          <label class="sr-only" for="dday-label">이름</label>
          <input type="text" id="dday-label" maxlength="24" placeholder="이름 (예: 수능, 여행)" />
          <label class="sr-only" for="dday-date">날짜</label>
          <input type="date" id="dday-date" required />
          <button class="primary-btn" type="submit" id="btn-add">추가</button>
        </form>
        <p class="slot-hint">남은 칸 <strong id="slots-left">5</strong>개 · 오늘 <span id="today-label">—</span></p>

        <div class="overview" id="overview" hidden>
          <div class="overview-chip upcoming">
            <span class="chip-num" id="count-upcoming">0</span>
            <span class="chip-label">다가오는 날</span>
          </div>
          <div class="overview-chip today-chip">
            <span class="chip-num" id="count-today">0</span>
            <span class="chip-label">오늘</span>
          </div>
          <div class="overview-chip past">
            <span class="chip-num" id="count-past">0</span>
            <span class="chip-label">지난 날</span>
          </div>
        </div>

        <ul class="dday-list" id="dday-list" aria-label="디데이 목록"></ul>
        <p class="empty-msg" id="empty-msg">아직 등록한 날이 없습니다. 이름과 날짜를 고르고 추가를 눌러 보세요.</p>

        <div class="panel-actions">
          <button class="ghost-btn" type="button" id="btn-clear-past">지난 날만 지우기</button>
          <button class="ghost-btn" type="button" id="btn-reset-all">전체 비우기</button>
        </div>

        <p class="fine-print">목록은 이 브라우저에만 저장됩니다. 날짜는 자정(한국 시간) 기준으로 계산합니다.</p>
      </section>

      <footer class="foot">© kswany · 실험은 방문자의 브라우저에서만 실행됩니다</footer>
    </div>
    <script src="dday.js" defer></script>
    <script src="../../js/nav.js" defer></script>
    <script src="../../js/lab.js" defer></script>
  </body>
</html>
