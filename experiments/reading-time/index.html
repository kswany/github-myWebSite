<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>읽기 시간 — kswany</title>
    <meta name="description" content="글을 붙여 넣으면 대략 몇 분 걸리는지 읽기 시간을 추정해 줍니다. 서버 없이 브라우저에서만 실행됩니다." />
    <link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <link rel="stylesheet" href="../../css/site.css" />
    <link rel="stylesheet" href="read.css" />
  </head>
  <body>
    <div class="wrap">
      <header class="topbar">
        <a class="brand" href="../../">
          <strong>kswany</strong>
          <span>게임과 실험</span>
        </a>
        <nav class="nav">
          <a href="../../">홈</a>
          <a href="../../saju/">사주</a>
          <a href="../../games/">게임</a>
          <a href="../" aria-current="page">실험</a>
          <a href="../../guestbook/">방명록</a>
        </nav>
      </header>

      <section class="page-head">
        <div class="seal">READ</div>
        <h1>읽기 시간</h1>
        <p>글을 붙여 넣으면 대략 몇 분 걸리는지 바로 추정합니다. 입력값은 서버로 보내지 않습니다.</p>
      </section>

      <section class="panel">
        <div class="speed-bar" role="tablist" aria-label="읽기 속도 선택">
          <button class="speed-btn" type="button" role="tab" id="tab-slow" aria-selected="false" data-speed="slow">느리게</button>
          <button class="speed-btn active" type="button" role="tab" id="tab-normal" aria-selected="true" data-speed="normal">보통</button>
          <button class="speed-btn" type="button" role="tab" id="tab-fast" aria-selected="false" data-speed="fast">빠르게</button>
        </div>

        <label class="field">
          <span>텍스트</span>
          <textarea id="text-input" rows="10" placeholder="블로그 글, 공지, 메일 등을 붙여 넣어 보세요"></textarea>
        </label>

        <div class="actions">
          <button class="ghost" type="button" id="clear-btn">비우기</button>
          <button class="ghost" type="button" id="sample-btn">예시 넣기</button>
        </div>

        <div class="result-stage" id="result-stage" aria-live="polite">
          <p class="result-kicker">예상 읽기 시간</p>
          <p class="result-time" id="result-time">0초</p>
          <div class="gauge-wrap" aria-hidden="true">
            <div class="gauge-track">
              <div class="gauge-fill" id="gauge-fill"></div>
            </div>
            <div class="gauge-labels">
              <span>짧음</span>
              <span>보통</span>
              <span>길음</span>
            </div>
          </div>
        </div>

        <div class="stat-grid" id="stat-grid">
          <div class="stat-card">
            <span class="stat-label">글자 (공백 제외)</span>
            <strong class="stat-value" id="stat-chars">0</strong>
          </div>
          <div class="stat-card">
            <span class="stat-label">영어 단어</span>
            <strong class="stat-value" id="stat-words">0</strong>
          </div>
          <div class="stat-card">
            <span class="stat-label">줄 수</span>
            <strong class="stat-value" id="stat-lines">0</strong>
          </div>
          <div class="stat-card">
            <span class="stat-label">기준 속도</span>
            <strong class="stat-value stat-speed" id="stat-speed">450자/분</strong>
          </div>
        </div>

        <p class="hint" id="stat-hint">한글은 글자 수, 영어는 단어 수로 계산합니다.</p>
      </section>

      <footer class="foot">© kswany · 입력값은 이 브라우저에서만 처리됩니다</footer>
    </div>
    <script src="read.js" defer></script>
    <script src="../../js/nav.js" defer></script>
    <script src="../../js/lab.js" defer></script>
  </body>
</html>
