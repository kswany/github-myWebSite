<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>타임존 변환 — kswany</title>
    <meta name="description" content="도시를 고르면 지금 시각과 UTC 오프셋을 나란히 비교합니다. 브라우저에서만 실행됩니다." />
    <link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <link rel="stylesheet" href="../../css/site.css" />
    <link rel="stylesheet" href="tz.css" />
  </head>
  <body>
    <div class="wrap">
      <header class="topbar">
        <a class="brand" href="../../">
          <strong>kswany</strong>
          <span>게임과 실험</span>
        </a>
        <nav class="nav">
          <a href="../../">홈</a>
          <a href="../../saju/">사주</a>
          <a href="../../games/">게임</a>
          <a href="../" aria-current="page">실험</a>
          <a href="../../guestbook/">방명록</a>
        </nav>
      </header>

      <section class="page-head">
        <div class="seal">TZ</div>
        <h1>타임존 변환</h1>
        <p>두 도시를 고르면 지금 시각과 UTC 오프셋을 나란히 보여 줍니다. 해외 미팅·출시 시간 맞출 때 쓰기 좋습니다.</p>
      </section>

      <section class="panel">
        <p class="field-label">빠른 비교</p>
        <div class="preset-row" id="presets">
          <button class="chip preset" type="button" data-a="Asia/Seoul" data-b="UTC">서울 ↔ UTC</button>
          <button class="chip preset" type="button" data-a="Asia/Seoul" data-b="America/New_York">서울 ↔ 뉴욕</button>
          <button class="chip preset" type="button" data-a="Asia/Seoul" data-b="America/Los_Angeles">서울 ↔ LA</button>
          <button class="chip preset" type="button" data-a="Asia/Seoul" data-b="Europe/London">서울 ↔ 런던</button>
          <button class="chip preset" type="button" data-a="Asia/Seoul" data-b="Asia/Tokyo">서울 ↔ 도쿄</button>
        </div>

        <div class="pick-row">
          <div class="field">
            <label for="zone-a">첫 번째</label>
            <select id="zone-a"></select>
          </div>
          <button class="swap-btn" type="button" id="swap" aria-label="두 도시 바꾸기">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path d="M7 16V4M7 4L3 8M7 4l4 4" />
              <path d="M17 8v12M17 20l4-4M17 20l-4-4" />
            </svg>
          </button>
          <div class="field">
            <label for="zone-b">두 번째</label>
            <select id="zone-b"></select>
          </div>
        </div>

        <div class="clock-grid" aria-live="polite">
          <article class="clock-card" id="card-a">
            <p class="clock-city" id="label-a">—</p>
            <p class="clock-offset" id="offset-a">—</p>
            <p class="clock-time" id="time-a">—</p>
            <p class="clock-date" id="date-a">—</p>
          </article>
          <article class="clock-card accent" id="card-b">
            <p class="clock-city" id="label-b">—</p>
            <p class="clock-offset" id="offset-b">—</p>
            <p class="clock-time" id="time-b">—</p>
            <p class="clock-date" id="date-b">—</p>
          </article>
        </div>

        <div class="diff-banner" id="diff-banner">
          <span class="diff-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10" />
              <path d="M12 6v6l4 2" />
            </svg>
          </span>
          <p id="diff-text">도시를 고르면 시차를 알려 드립니다.</p>
        </div>

        <p class="panel-foot">1초마다 갱신 · 기기 시계를 기준으로 계산합니다</p>
      </section>

      <footer class="foot">© kswany · 선택은 방문자의 브라우저에서만 처리됩니다</footer>
    </div>
    <script src="tz.js"></script>
    <script src="../../js/nav.js" defer></script>
    <script src="../../js/lab.js" defer></script>
  </body>
</html>
