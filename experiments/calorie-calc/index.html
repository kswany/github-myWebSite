<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>칼로리 간단 계산 — kswany</title>
    <meta name="description" content="자주 먹는 음식과 분량을 고르면 대략 칼로리를 더해 봅니다. 참고용 추정치이며 브라우저에서만 계산됩니다." />
    <link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <link rel="stylesheet" href="../../css/site.css" />
    <link rel="stylesheet" href="calorie.css" />
  </head>
  <body>
    <div class="wrap">
      <header class="topbar">
        <a class="brand" href="../../">
          <strong>kswany</strong>
          <span>게임과 실험</span>
        </a>
        <nav class="nav">
          <a href="../../">홈</a>
          <a href="../../saju/">사주</a>
          <a href="../../games/">게임</a>
          <a href="../" aria-current="page">실험</a>
          <a href="../../guestbook/">방명록</a>
        </nav>
      </header>

      <section class="page-head">
        <div class="seal">KCAL</div>
        <h1>칼로리 간단 계산</h1>
        <p>음식과 분량을 고르면 대략 몇 kcal인지 더해 봅니다. 일반적인 1인분 기준이며, 실제와 차이가 있을 수 있는 참고용입니다.</p>
      </section>

      <section class="panel">
        <div class="goal-row">
          <label class="field-inline" for="daily-goal">
            <span>하루 목표 (kcal)</span>
            <input type="range" id="daily-goal" min="1200" max="3000" step="50" value="2000" />
            <strong id="daily-goal-val">2000</strong>
          </label>
          <div class="preset-row" role="group" aria-label="목표 프리셋">
            <button class="preset" type="button" data-goal="1800">1800</button>
            <button class="preset active" type="button" data-goal="2000">2000</button>
            <button class="preset" type="button" data-goal="2300">2300</button>
          </div>
        </div>

        <div class="total-card" aria-live="polite">
          <div class="total-head">
            <p class="result-kicker">지금까지 합계</p>
            <button class="ghost-btn" type="button" id="clear-all">전체 비우기</button>
          </div>
          <p class="total-main"><span id="total-kcal">0</span> <small>kcal</small></p>
          <div class="progress-wrap" aria-hidden="true">
            <div class="progress-bar" id="progress-bar"></div>
          </div>
          <p class="total-sub" id="total-hint">음식을 눌러 목록에 담으세요.</p>
        </div>

        <div class="tab-bar" role="tablist" aria-label="음식 종류" id="cat-tabs"></div>

        <div class="food-grid" id="food-grid" role="list"></div>

        <h2 class="section-title">담은 음식</h2>
        <ul class="meal-list" id="meal-list" aria-label="선택한 음식 목록">
          <li class="meal-empty" id="meal-empty">아직 담은 음식이 없습니다.</li>
        </ul>

        <p class="fine-print">영양 성분은 평균적인 1인분·표준 분량을 바탕으로 한 추정치입니다. 질병·다이어트 상담은 전문가와 상의하세요.</p>
      </section>

      <footer class="foot">© kswany · 실험은 방문자의 브라우저에서만 실행됩니다</footer>
    </div>
    <script src="calorie.js" defer></script>
    <script src="../../js/nav.js" defer></script>
  </body>
</html>
