<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>밸런스 게임 — kswany</title>
    <meta name="description" content="둘 중 더 끌리는 쪽을 고르는 짧은 밸런스 게임. 여덟 장을 고르면 오늘 취향이 한 판에 나옵니다." />
    <link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <link rel="stylesheet" href="../../css/site.css" />
    <link rel="stylesheet" href="balance.css" />
  </head>
  <body>
    <div class="wrap">
      <header class="topbar">
        <a class="brand" href="../../">
          <strong>kswany</strong>
          <span>게임과 실험</span>
        </a>
        <nav class="nav">
          <a href="../../">홈</a>
          <a href="../../saju/">사주</a>
          <a href="../../games/">게임</a>
          <a href="../" aria-current="page">실험</a>
          <a href="../../guestbook/">방명록</a>
        </nav>
      </header>

      <section class="page-head">
        <div class="seal">BALANCE</div>
        <h1>밸런스 게임</h1>
        <p>사진 두 장 중 지금 더 끌리는 쪽을 고르세요. 여덟 번이면 오늘의 취향이 한 판으로 모입니다.</p>
      </section>

      <section class="panel">
        <div class="hud">
          <span>문항 <strong id="q-num">1</strong> / <strong>8</strong></span>
          <span>지난번 <strong id="last-picks">-</strong></span>
        </div>

        <div class="progress-track" aria-hidden="true">
          <div class="progress-fill" id="progress-fill"></div>
        </div>

        <p class="question" id="question">-</p>

        <div class="match" id="match">
          <button class="pick-btn" type="button" id="choice-a" aria-label="왼쪽 고르기"></button>
          <p class="versus" aria-hidden="true">대</p>
          <button class="pick-btn" type="button" id="choice-b" aria-label="오른쪽 고르기"></button>
        </div>

        <div class="overlay" id="result">
          <p class="winner-kicker">오늘의 취향</p>
          <div class="mosaic" id="mosaic"></div>
          <h2 class="section-title" id="result-title">-</h2>
          <p class="reading" id="result-desc"></p>
          <div class="actions" style="margin-top: 14px">
            <button class="primary" type="button" id="again">다시 고르기</button>
          </div>
        </div>

        <div class="actions" style="margin-top: 16px">
          <button class="ghost" type="button" id="restart">처음부터</button>
        </div>
      </section>

      <footer class="foot">© kswany · 선택은 방문자의 브라우저에서만 이뤄집니다</footer>
    </div>
    <script src="balance.js"></script>
    <script src="../../js/nav.js" defer></script>
    <script src="../../js/lab.js" defer></script>
  </body>
</html>
