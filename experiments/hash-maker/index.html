<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>해시 만들기 — kswany</title>
    <meta name="description" content="글을 넣으면 SHA-256 등 해시값을 만듭니다. 브라우저에서만 실행됩니다." />
    <link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <link rel="stylesheet" href="../../css/site.css" />
    <link rel="stylesheet" href="hash.css" />
  </head>
  <body>
    <div class="wrap">
      <header class="topbar">
        <a class="brand" href="../../">
          <strong>kswany</strong>
          <span>게임과 실험</span>
        </a>
        <nav class="nav">
          <a href="../../">홈</a>
          <a href="../../saju/">사주</a>
          <a href="../../games/">게임</a>
          <a href="../" aria-current="page">실험</a>
          <a href="../../guestbook/">방명록</a>
        </nav>
      </header>

      <section class="page-head">
        <div class="seal">HASH</div>
        <h1>해시 만들기</h1>
        <p>비밀번호·문장을 넣으면 SHA 해시값을 바로 만듭니다. 입력은 서버로 보내지 않습니다.</p>
      </section>

      <section class="panel">
        <div class="mode-tabs" role="tablist" aria-label="해시 종류">
          <button class="mode-tab active" type="button" role="tab" aria-selected="true" data-algo="SHA-256">SHA-256</button>
          <button class="mode-tab" type="button" role="tab" aria-selected="false" data-algo="SHA-384">SHA-384</button>
          <button class="mode-tab" type="button" role="tab" aria-selected="false" data-algo="SHA-512">SHA-512</button>
        </div>

        <p class="mode-desc" id="mode-desc">SHA-256은 64자리 16진수. 파일·비밀번호 확인에 많이 씁니다.</p>

        <label class="field">
          <span>입력</span>
          <textarea id="hash-input" rows="6" spellcheck="false" placeholder="해시할 글을 붙여 넣으세요"></textarea>
        </label>

        <p class="meta" id="input-meta" aria-live="polite">0바이트 (UTF-8)</p>

        <div class="options">
          <fieldset class="option-group">
            <legend>표시</legend>
            <div class="chip-row" role="group" aria-label="대소문자">
              <button class="chip active" type="button" data-case="lower">소문자</button>
              <button class="chip" type="button" data-case="upper">대문자</button>
            </div>
          </fieldset>
        </div>

        <div class="hash-stage" aria-live="polite">
          <p class="stage-kicker">해시 결과</p>
          <p class="hash-result empty" id="hash-result">입력하면 여기에 해시가 나옵니다</p>
        </div>

        <div class="actions">
          <button class="primary" type="button" id="copy-btn" disabled>해시 복사</button>
          <button class="ghost" type="button" id="sample-btn">예시 넣기</button>
          <button class="ghost" type="button" id="clear-btn">비우기</button>
        </div>

        <div class="status ok" id="status-ok" hidden aria-live="polite">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M20 6L9 17l-5-5" />
          </svg>
          <span>복사했습니다.</span>
        </div>

        <p class="hint">같은 글은 항상 같은 해시가 나옵니다. 해시만으로 원문을 되돌릴 수는 없습니다.</p>
      </section>

      <footer class="foot">© kswany · 해시는 이 브라우저에서만 만듭니다</footer>
    </div>
    <script src="hash.js" defer></script>
    <script src="../../js/nav.js" defer></script>
    <script src="../../js/lab.js" defer></script>
  </body>
</html>
