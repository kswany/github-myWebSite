<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lorem 채우기 — kswany</title>
    <meta name="description" content="원하는 글자 수만 넣으면 더미 한글 문장을 만들어 줍니다. 브라우저에서만 실행됩니다." />
    <link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <link rel="stylesheet" href="../../css/site.css" />
    <link rel="stylesheet" href="lorem.css" />
  </head>
  <body>
    <div class="wrap">
      <header class="topbar">
        <a class="brand" href="../../">
          <strong>kswany</strong>
          <span>게임과 실험</span>
        </a>
        <nav class="nav">
          <a href="../../">홈</a>
          <a href="../../saju/">사주</a>
          <a href="../../games/">게임</a>
          <a href="../" aria-current="page">실험</a>
          <a href="../../guestbook/">방명록</a>
        </nav>
      </header>

      <section class="page-head">
        <div class="seal">LOREM</div>
        <h1>Lorem 채우기</h1>
        <p>원하는 글자 수를 넣으면 디자인·시안용 더미 한글 문장을 만들어 줍니다. 값은 서버로 보내지 않습니다.</p>
      </section>

      <section class="panel">
        <fieldset class="option-group">
          <legend>글자 수</legend>
          <div class="chip-row" role="group" aria-label="글자 수 프리셋">
            <button class="chip" type="button" data-count="50">50자</button>
            <button class="chip active" type="button" data-count="100">100자</button>
            <button class="chip" type="button" data-count="200">200자</button>
            <button class="chip" type="button" data-count="500">500자</button>
            <button class="chip" type="button" data-count="1000">1000자</button>
          </div>
        </fieldset>

        <div class="length-row">
          <label for="count-input">직접 입력</label>
          <div class="length-controls">
            <input type="number" id="count-input" min="10" max="5000" value="100" step="10" />
            <span class="unit">자</span>
          </div>
        </div>

        <fieldset class="style-group">
          <legend>형식</legend>
          <div class="chip-row" role="group" aria-label="문장 형식">
            <button class="chip active" type="button" data-style="flow">한 줄로</button>
            <button class="chip" type="button" data-style="paragraph">단락 나누기</button>
          </div>
        </fieldset>

        <div class="actions">
          <button class="primary" type="button" id="generate-btn">문장 만들기</button>
          <button class="ghost" type="button" id="copy-btn" disabled>복사</button>
        </div>

        <label class="field">
          <span>결과 <em id="result-count">0자</em></span>
          <textarea id="result-output" rows="10" readonly placeholder="버튼을 누르면 더미 문장이 나옵니다"></textarea>
        </label>

        <div class="status ok" id="status-ok" hidden aria-live="polite">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M20 6L9 17l-5-5" />
          </svg>
          <span>복사했습니다.</span>
        </div>

        <p class="hint">실제 글 대신 레이아웃 확인용으로 쓰세요. 문장은 무작위로 이어 붙입니다.</p>
      </section>

      <footer class="foot">© kswany · 더미 문장은 이 브라우저에서만 만듭니다</footer>
    </div>
    <script src="lorem.js" defer></script>
    <script src="../../js/nav.js" defer></script>
    <script src="../../js/lab.js" defer></script>
  </body>
</html>
