<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>정규식 시험 — kswany</title>
    <meta name="description" content="정규식 패턴과 글을 넣으면 바로 맞는지 확인합니다. 서버 없이 브라우저에서만 실행됩니다." />
    <link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <link rel="stylesheet" href="../../css/site.css" />
    <link rel="stylesheet" href="regex.css" />
  </head>
  <body>
    <div class="wrap">
      <header class="topbar">
        <a class="brand" href="../../">
          <strong>kswany</strong>
          <span>게임과 실험</span>
        </a>
        <nav class="nav">
          <a href="../../">홈</a>
          <a href="../../saju/">사주</a>
          <a href="../../games/">게임</a>
          <a href="../" aria-current="page">실험</a>
          <a href="../../guestbook/">방명록</a>
        </nav>
      </header>

      <section class="page-head">
        <div class="seal">REG</div>
        <h1>정규식 시험</h1>
        <p>패턴과 글을 넣으면 맞는 부분을 바로 표시합니다. 개발·학습용으로 가볍게 써 보세요.</p>
      </section>

      <section class="panel">
        <label class="field">
          <span>패턴</span>
          <div class="pattern-row">
            <span class="pattern-slash" aria-hidden="true">/</span>
            <input id="pattern-input" type="text" spellcheck="false" autocomplete="off" placeholder="예: [0-9]+" />
            <span class="pattern-slash" aria-hidden="true">/</span>
            <span class="flag-group" role="group" aria-label="옵션">
              <button class="flag-chip" type="button" data-flag="g" aria-pressed="true">g</button>
              <button class="flag-chip" type="button" data-flag="i" aria-pressed="false">i</button>
              <button class="flag-chip" type="button" data-flag="m" aria-pressed="false">m</button>
            </span>
          </div>
        </label>

        <div class="quick-patterns" role="group" aria-label="자주 쓰는 패턴">
          <button class="chip" type="button" data-pattern="\\d+">숫자</button>
          <button class="chip" type="button" data-pattern="[가-힣]+">한글</button>
          <button class="chip" type="button" data-pattern="[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}">이메일</button>
          <button class="chip" type="button" data-pattern="010-\\d{4}-\\d{4}">전화</button>
        </div>

        <label class="field">
          <span>시험할 글</span>
          <textarea id="text-input" rows="7" spellcheck="false" placeholder="여기에 글을 붙여 넣으세요"></textarea>
        </label>

        <div class="toolbar">
          <div class="actions">
            <button class="primary" type="button" id="test-btn">시험하기</button>
            <button class="ghost" type="button" id="sample-btn">예시 넣기</button>
            <button class="ghost" type="button" id="clear-btn">비우기</button>
          </div>
        </div>

        <div class="status ok" id="status-ok" hidden aria-live="polite">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M20 6L9 17l-5-5" />
          </svg>
          <span id="status-ok-text">0개 일치</span>
        </div>

        <div class="status err" id="status-err" hidden aria-live="assertive">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <circle cx="12" cy="12" r="10" />
            <path d="M12 8v4M12 16h.01" />
          </svg>
          <div>
            <strong>패턴 오류</strong>
            <p id="status-err-text"></p>
          </div>
        </div>

        <div class="result-block">
          <div class="result-head">
            <span>결과 미리보기</span>
            <span class="result-count" id="match-count">—</span>
          </div>
          <div class="highlight-box" id="highlight-box" aria-live="polite">
            <span class="placeholder">패턴과 글을 넣으면 맞는 부분이 색으로 표시됩니다</span>
          </div>
        </div>

        <div class="match-list-wrap" id="match-list-wrap" hidden>
          <p class="match-list-title">일치 목록</p>
          <ol class="match-list" id="match-list"></ol>
        </div>

        <p class="hint" id="stat-hint">입력값은 서버로 보내지 않습니다. 글을 붙여 넣으면 자동으로 시험합니다.</p>
      </section>

      <footer class="foot">© kswany · 정규식은 이 브라우저에서만 실행됩니다</footer>
    </div>
    <script src="regex.js" defer></script>
    <script src="../../js/nav.js" defer></script>
    <script src="../../js/lab.js" defer></script>
  </body>
</html>
