<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>가벼운 계산기 — kswany</title>
    <meta name="description" content="디데이와 팁 나누기를 바로 계산하는 작은 도구. 브라우저에서만 실행됩니다." />
    <link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <link rel="stylesheet" href="../../css/site.css" />
    <link rel="stylesheet" href="calc.css" />
  </head>
  <body>
    <div class="wrap">
      <header class="topbar">
        <a class="brand" href="../../">
          <strong>kswany</strong>
          <span>게임과 실험</span>
        </a>
        <nav class="nav">
          <a href="../../">홈</a>
          <a href="../../saju/">사주</a>
          <a href="../../games/">게임</a>
          <a href="../" aria-current="page">실험</a>
          <a href="../../guestbook/">방명록</a>
        </nav>
      </header>

      <section class="page-head">
        <div class="seal">CALC</div>
        <h1>가벼운 계산기</h1>
        <p>디데이와 팁 나누기를 바로 계산합니다. 입력값은 서버로 보내지 않고 이 브라우저에서만 처리됩니다.</p>
      </section>

      <section class="panel">
        <div class="tab-bar" role="tablist" aria-label="계산기 종류">
          <button class="tab active" type="button" role="tab" id="tab-dday" aria-selected="true" aria-controls="panel-dday">디데이</button>
          <button class="tab" type="button" role="tab" id="tab-tip" aria-selected="false" aria-controls="panel-tip">팁 나누기</button>
        </div>

        <div class="tab-panel active" id="panel-dday" role="tabpanel" aria-labelledby="tab-dday">
          <h2 class="section-title">디데이</h2>
          <p class="panel-desc">목표 날짜를 고르면 오늘 기준 며칠 남았는지, 며칠 지났는지 보여 줍니다.</p>

          <div class="field-row">
            <div class="field">
              <label for="dday-date">목표 날짜</label>
              <input type="date" id="dday-date" />
            </div>
            <div class="field">
              <label for="dday-label">이름 (선택)</label>
              <input type="text" id="dday-label" placeholder="예: 시험, 여행" maxlength="20" />
            </div>
          </div>

          <div class="result-card" id="dday-result" aria-live="polite">
            <p class="result-kicker" id="dday-kicker">날짜를 고르세요</p>
            <p class="result-main" id="dday-main">-</p>
            <p class="result-sub" id="dday-sub">오늘 날짜를 기준으로 계산합니다.</p>
          </div>
        </div>

        <div class="tab-panel" id="panel-tip" role="tabpanel" aria-labelledby="tab-tip" hidden>
          <h2 class="section-title">팁 나누기</h2>
          <p class="panel-desc">총 금액과 인원, 팁 비율을 넣으면 1인당 부담액을 계산합니다.</p>

          <div class="field-row">
            <div class="field">
              <label for="tip-total">총 금액 (원)</label>
              <input type="number" id="tip-total" min="0" step="100" placeholder="50000" inputmode="numeric" />
            </div>
            <div class="field">
              <label for="tip-people">인원</label>
              <input type="number" id="tip-people" min="1" max="99" value="2" inputmode="numeric" />
            </div>
          </div>

          <div class="field">
            <label>팁 비율</label>
            <div class="tip-choices" id="tip-choices">
              <button class="tip-chip" type="button" data-tip="0">0%</button>
              <button class="tip-chip active" type="button" data-tip="10">10%</button>
              <button class="tip-chip" type="button" data-tip="15">15%</button>
              <button class="tip-chip" type="button" data-tip="20">20%</button>
            </div>
          </div>

          <div class="result-card tip" id="tip-result" aria-live="polite">
            <div class="tip-grid">
              <div class="tip-box">
                <span class="label">1인당</span>
                <strong id="tip-per">-</strong>
              </div>
              <div class="tip-box">
                <span class="label">팁 합계</span>
                <strong id="tip-amount">-</strong>
              </div>
              <div class="tip-box">
                <span class="label">총합</span>
                <strong id="tip-grand">-</strong>
              </div>
            </div>
          </div>
        </div>
      </section>

      <footer class="foot">© kswany · 계산은 방문자의 브라우저에서만 이뤄집니다</footer>
    </div>
    <script src="calc.js"></script>
    <script src="../../js/nav.js" defer></script>
    <script src="../../js/lab.js" defer></script>
  </body>
</html>
