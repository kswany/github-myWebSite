<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>오늘의 한 줄 — kswany</title>
    <meta name="description" content="버튼 한 번에 짧은 위로·응원 문장을 받아 보세요. 브라우저에서만 실행됩니다." />
    <link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <link rel="stylesheet" href="../../css/site.css" />
    <link rel="stylesheet" href="line.css" />
  </head>
  <body>
    <div class="wrap">
      <header class="topbar">
        <a class="brand" href="../../">
          <strong>kswany</strong>
          <span>게임과 실험</span>
        </a>
        <nav class="nav">
          <a href="../../">홈</a>
          <a href="../../saju/">사주</a>
          <a href="../../games/">게임</a>
          <a href="../" aria-current="page">실험</a>
          <a href="../../guestbook/">방명록</a>
        </nav>
      </header>

      <section class="page-head">
        <div class="seal">LINE</div>
        <h1>오늘의 한 줄</h1>
        <p>마음이 무거울 때, 버튼 한 번이면 짧은 위로와 응원 문장이 나옵니다. 서버로 보내지 않습니다.</p>
      </section>

      <section class="panel">
        <div class="mood-bar" role="tablist" aria-label="분위기 선택">
          <button class="mood-btn active" type="button" role="tab" id="tab-all" aria-selected="true" data-mood="all">전체</button>
          <button class="mood-btn" type="button" role="tab" id="tab-comfort" aria-selected="false" data-mood="comfort">위로</button>
          <button class="mood-btn" type="button" role="tab" id="tab-cheer" aria-selected="false" data-mood="cheer">응원</button>
          <button class="mood-btn" type="button" role="tab" id="tab-rest" aria-selected="false" data-mood="rest">휴식</button>
          <button class="mood-btn" type="button" role="tab" id="tab-smile" aria-selected="false" data-mood="smile">웃음</button>
        </div>

        <div class="line-stage" id="line-stage" aria-live="polite">
          <p class="line-kicker" id="line-kicker">준비됐어요</p>
          <blockquote class="line-text" id="line-text">아래 버튼을 누르면 한 줄이 나옵니다.</blockquote>
          <p class="line-tag" id="line-tag"></p>
        </div>

        <div class="actions">
          <button class="primary" type="button" id="draw-btn">한 줄 받기</button>
          <button class="ghost" type="button" id="copy-btn" disabled>복사</button>
        </div>

        <p class="hint">오늘 <strong id="today-count">0</strong>번째 · 지난 한 줄 <strong id="last-line">-</strong></p>
      </section>

      <footer class="foot">© kswany · 오늘의 한 줄은 이 브라우저에서만 돌아갑니다</footer>
    </div>
    <script src="../../js/nav.js" defer></script>
    <script src="../../js/lab.js" defer></script>
    <script src="line.js" defer></script>
  </body>
</html>
