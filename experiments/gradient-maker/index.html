<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CSS 그라데이션 — kswany</title>
    <meta name="description" content="두 색과 각도를 고르면 linear-gradient CSS 코드를 만들어 줍니다. 브라우저에서만 실행됩니다." />
    <link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <link rel="stylesheet" href="../../css/site.css" />
    <link rel="stylesheet" href="gradient.css" />
  </head>
  <body>
    <div class="wrap">
      <header class="topbar">
        <a class="brand" href="../../">
          <strong>kswany</strong>
          <span>게임과 실험</span>
        </a>
        <nav class="nav">
          <a href="../../">홈</a>
          <a href="../../saju/">사주</a>
          <a href="../../games/">게임</a>
          <a href="../" aria-current="page">실험</a>
          <a href="../../guestbook/">방명록</a>
        </nav>
      </header>

      <section class="page-head">
        <div class="seal">GRAD</div>
        <h1>CSS 그라데이션</h1>
        <p>시작·끝 색과 방향을 고르면 linear-gradient 코드를 바로 만들어 줍니다. 값은 서버로 보내지 않습니다.</p>
      </section>

      <section class="panel">
        <div class="preview-box" id="preview" aria-hidden="true"></div>

        <div class="color-row">
          <label class="color-field">
            <span>시작 색</span>
            <div class="color-control">
              <input type="color" id="color-start" value="#6366F1" aria-label="시작 색" />
              <input type="text" id="hex-start" spellcheck="false" value="#6366F1" autocomplete="off" />
            </div>
          </label>
          <button class="swap-btn" type="button" id="swap-btn" aria-label="색 바꾸기">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path d="M7 16V4M7 4L3 8M7 4l4 4" />
              <path d="M17 8v12M17 20l4-4M17 20l-4-4" />
            </svg>
          </button>
          <label class="color-field">
            <span>끝 색</span>
            <div class="color-control">
              <input type="color" id="color-end" value="#EC4899" aria-label="끝 색" />
              <input type="text" id="hex-end" spellcheck="false" value="#EC4899" autocomplete="off" />
            </div>
          </label>
        </div>

        <fieldset class="angle-group">
          <legend>방향</legend>
          <div class="chip-row" role="group" aria-label="방향 프리셋">
            <button class="chip" type="button" data-angle="0">→</button>
            <button class="chip" type="button" data-angle="45">↗</button>
            <button class="chip active" type="button" data-angle="90">↑</button>
            <button class="chip" type="button" data-angle="135">↖</button>
            <button class="chip" type="button" data-angle="180">←</button>
            <button class="chip" type="button" data-angle="270">↓</button>
          </div>
        </fieldset>

        <div class="angle-row">
          <label for="angle-range">각도 <em id="angle-value">90°</em></label>
          <input type="range" id="angle-range" min="0" max="360" value="90" step="1" />
        </div>

        <div class="actions">
          <button class="primary" type="button" id="random-btn">무작위 조합</button>
          <button class="ghost" type="button" id="copy-btn">CSS 복사</button>
        </div>

        <label class="field">
          <span>CSS 코드</span>
          <textarea id="css-output" rows="3" readonly spellcheck="false"></textarea>
        </label>

        <div class="status ok" id="status-ok" hidden aria-live="polite">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M20 6L9 17l-5-5" />
          </svg>
          <span>복사했습니다.</span>
        </div>

        <p class="hint">미리보기 박스에 바로 적용됩니다. 복사한 코드를 CSS 파일이나 style 속성에 붙여 넣으세요.</p>
      </section>

      <footer class="foot">© kswany · 그라데이션은 이 브라우저에서만 만듭니다</footer>
    </div>
    <script src="gradient.js" defer></script>
    <script src="../../js/nav.js" defer></script>
    <script src="../../js/lab.js" defer></script>
  </body>
</html>
