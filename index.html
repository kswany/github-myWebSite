<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>kswany — 게임과 실험</title>
    <meta name="description" content="한국어로 바로 만지는 작은 게임과 실험. 사주, 월드컵, 반응속도." />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/site.css" />
  </head>
  <body>
    <div class="wrap">
      <header class="hero">
        <p class="brand-mark"><a href="./">kswany</a></p>
        <p class="tag">한국어로 바로 만지는 게임과 실험</p>
        <nav class="nav">
          <a href="./" aria-current="page">홈</a>
          <a href="saju/">사주</a>
          <a href="games/">게임</a>
          <a href="experiments/">실험</a>
          <a href="guestbook/">방명록</a>
        </nav>
      </header>

      <!-- 매일 자동화: 새 기능을 만들었으면 이 그리드에 카드를 반드시 추가한다. 홈 카드 없는 PR은 금지. -->
      <section class="grid" id="experiments">
        <a class="card" href="saju/" data-tone="cinnabar">
          <div class="card-visual" aria-hidden="true">
            <svg viewBox="0 0 72 72" fill="none" stroke="#c45c3a" stroke-width="2">
              <rect x="8" y="14" width="12" height="44" rx="2" />
              <rect x="24" y="14" width="12" height="44" rx="2" />
              <rect x="40" y="14" width="12" height="44" rx="2" />
              <rect x="56" y="14" width="12" height="44" rx="2" />
            </svg>
          </div>
          <div class="kicker">만세력</div>
          <h2>사주 보기</h2>
          <p>생년월일로 네 기둥을 바로 봅니다.</p>
        </a>
        <a class="card" href="games/" data-tone="moss">
          <div class="card-visual" aria-hidden="true">
            <svg viewBox="0 0 72 72" fill="none" stroke="#5d6e54" stroke-width="2">
              <rect x="10" y="10" width="22" height="22" rx="4" />
              <rect x="40" y="10" width="22" height="22" rx="4" />
              <rect x="10" y="40" width="22" height="22" rx="4" />
              <rect x="40" y="40" width="22" height="22" rx="4" fill="#5d6e54" fill-opacity=".15" />
            </svg>
          </div>
          <div class="kicker">기억</div>
          <h2>그림 짝맞추기</h2>
          <p>같은 그림 두 장을 찾으면 됩니다.</p>
        </a>
        <a class="card" href="experiments/food-worldcup/" data-tone="gold">
          <div class="card-visual" aria-hidden="true">
            <svg viewBox="0 0 72 72" fill="none" stroke="#c4a04a" stroke-width="2">
              <path d="M16 40c3 14 12 20 20 20s17-6 20-20" />
              <path d="M18 40h36" />
              <path d="M24 32c5-8 9-6 12 0 5-8 9-6 12 0" />
            </svg>
          </div>
          <div class="kicker">월드컵</div>
          <h2>음식 월드컵</h2>
          <p>둘 중 더 끌리는 쪽을 고르면 우승이 나옵니다.</p>
        </a>
        <a class="card" href="experiments/reaction-test/" data-tone="green">
          <div class="card-visual" aria-hidden="true">
            <svg viewBox="0 0 72 72" fill="none">
              <rect x="14" y="14" width="44" height="44" rx="8" fill="#3d8b5a" />
            </svg>
          </div>
          <div class="kicker">반사</div>
          <h2>반응속도</h2>
          <p>초록이 되면 바로 누르세요.</p>
        </a>
      </section>

      <p class="tiny-stats">
        오늘 <strong id="stat-today">…</strong> · 전체 <strong id="stat-total">…</strong>
      </p>
      <footer class="foot">© kswany</footer>
    </div>
    <script src="js/lab.js" defer></script>
  </body>
</html>
