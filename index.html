<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>kswany — 게임과 실험</title>
    <meta name="description" content="한국어로 바로 만지는 작은 게임과 실험. 사주, 월드컵, 반응속도." />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <link rel="stylesheet" href="css/site.css" />
  </head>
  <body>
    <div class="wrap">
      <header class="hero">
        <p class="brand-mark"><a href="./">kswany</a></p>
        <p class="tag">클릭하는 순간부터 재미있는 한국형 웹 실험실</p>
        <nav class="nav">
          <a href="./" aria-current="page">홈</a>
          <a href="saju/">사주</a>
          <a href="games/">게임</a>
          <a href="experiments/">실험</a>
          <a href="guestbook/">방명록</a>
        </nav>
      </header>

      <!-- 매일 자동화: 새 기능을 만들었으면 이 그리드에 카드를 반드시 추가한다. 홈 카드 없는 PR은 금지. css/site.css와 기존 게임은 수정하지 않는다. -->
      <section class="grid" id="experiments">
        <a class="card" href="saju/" data-tone="cinnabar">
          <div class="card-visual" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="4" width="18" height="18" rx="2" />
              <path d="M16 2v4M8 2v4M3 10h18" />
            </svg>
          </div>
          <div class="kicker">만세력</div>
          <h2>사주 보기</h2>
          <p>생년월일로 네 기둥을 바로 봅니다.</p>
        </a>
        <a class="card" href="games/" data-tone="moss">
          <div class="card-visual" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="7" height="7" rx="1" />
              <rect x="14" y="3" width="7" height="7" rx="1" />
              <rect x="3" y="14" width="7" height="7" rx="1" />
              <rect x="14" y="14" width="7" height="7" rx="1" />
            </svg>
          </div>
          <div class="kicker">기억</div>
          <h2>그림 짝맞추기</h2>
          <p>같은 그림 두 장을 찾으면 됩니다.</p>
        </a>
        <a class="card" href="experiments/food-worldcup/" data-tone="gold">
          <div class="card-visual" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M6 13a6 6 0 0 1 12 0" />
              <path d="M5 13h14" />
              <path d="M12 3v3" />
            </svg>
          </div>
          <div class="kicker">월드컵</div>
          <h2>음식 월드컵</h2>
          <p>둘 중 더 끌리는 쪽을 고르면 우승이 나옵니다.</p>
        </a>
        <a class="card" href="experiments/reaction-test/" data-tone="green">
          <div class="card-visual" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="8" />
              <path d="M12 8v4l3 2" />
            </svg>
          </div>
          <div class="kicker">반사</div>
          <h2>반응속도</h2>
          <p>초록이 되면 바로 누르세요.</p>
        </a>
      </section>

      <p class="tiny-stats">
        오늘 <strong id="stat-today">…</strong> · 전체 <strong id="stat-total">…</strong>
      </p>
      <footer class="foot">© kswany</footer>
    </div>
    <script src="js/lab.js" defer></script>
  </body>
</html>
