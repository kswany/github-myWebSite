<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>그림 짝맞추기 — kswany</title>
    <meta name="description" content="같은 그림 두 장을 찾는 기억 게임. 브라우저에서만 실행됩니다." />
    <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <link rel="stylesheet" href="../css/site.css" />
  </head>
  <body>
    <div class="wrap">
      <header class="topbar">
        <a class="brand" href="../">
          <strong>kswany</strong>
          <span>게임과 실험</span>
        </a>
        <nav class="nav">
          <a href="../">홈</a>
          <a href="../saju/">사주</a>
          <a href="./" aria-current="page">게임</a>
          <a href="../experiments/">실험</a>
          <a href="../guestbook/">방명록</a>
        </nav>
      </header>

      <section class="page-head">
        <div class="seal">MINI GAME</div>
        <h1>그림 짝맞추기</h1>
        <p>같은 그림 두 장을 찾아 짝지으세요. 나무, 불, 산, 물처럼 간단한 그림입니다. 기록은 이 브라우저에만 남습니다.</p>
      </section>

      <section class="panel">
        <div class="hud">
          <span>이동 <strong id="moves">0</strong></span>
          <span>시간 <strong id="time">0.0</strong>초</span>
          <span>최고 <strong id="best">-</strong></span>
        </div>
        <div class="board" id="board"></div>
        <div class="overlay" id="overlay">
          <h2 class="section-title" style="margin-top: 0">모두 맞췄습니다</h2>
          <p class="reading" id="summary"></p>
          <div class="actions" style="margin-top: 14px">
            <button class="primary" type="button" id="again">다시 하기</button>
          </div>
        </div>
        <div class="actions" style="margin-top: 16px">
          <button class="ghost" type="button" id="restart">새 판</button>
        </div>
      </section>

      <footer class="foot">© kswany · 게임도 방문자의 브라우저에서만 실행됩니다</footer>
    </div>
    <script src="match.js"></script>
    <script src="../js/lab.js" defer></script>
  </body>
</html>
